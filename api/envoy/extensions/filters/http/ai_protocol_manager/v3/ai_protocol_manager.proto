syntax = "proto3";

package envoy.extensions.filters.http.ai_protocol_manager.v3;

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.ai_protocol_manager.v3";
option java_outer_classname = "AiProtocolManagerProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/ai_protocol_manager/v3;ai_protocol_managerv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: AI Protocol Manager]
// AI Protocol Manager filter
// :ref:`configuration overview <config_http_filters_ai_protocol_manager>`.
// [#extension: envoy.filters.http.ai_protocol_manager]

// Configuration for the AI Protocol Manager filter.
message AiProtocolManager {
  // If true and no route-specific configuration is matched, the filter performs
  // best-effort JSON parsing on the request payload to make the parsed JSON DOM
  // available to subsequent filters, without rejecting the request if parsing fails.
  // If false (default) and no route-specific configuration is matched, the filter
  // does not parse the payload and simply passes it through.
  bool best_effort_parsing = 1;
}

// Target schema for the JSON payload.
enum TargetSchema {
  TARGET_SCHEMA_UNSPECIFIED = 0;
  OPENAI_CHAT = 1;
}

// Route-specific configuration for the AI Protocol Manager filter.
// This is intended to be configured on routes matching specific REST endpoints
// (e.g. "/chat/completions").
message AiProtocolManagerPerRoute {
  // The target schema that describes what the JSON payload format is and what it contains
  // (e.g., OPENAI_CHAT).
  TargetSchema target_schema = 1;

  // Whether to normalize / transcode the payload to the canonical schema.
  // If false (default), this is a pass-through endpoint where the payload is parsed
  // according to the target schema without transcoding.
  // If true, the payload is normalized/transcoded to the canonical schema.
  bool normalize = 2;
}
