# ai_protocol_manager — OpenAI ⇄ Gemini Vertex bidirectional translation
#
# Listens on :10000. The full translation:
#
#   1. Client sends OpenAI chat/completions JSON.
#   2. Filter parses → GeminiEncoder re-emits as Gemini generateContent
#      JSON, path rewritten to the Vertex template
#         /v1/projects/{gcp_project}/locations/{gcp_location}
#         /publishers/google/models/{model}:generateContent
#   3. Vertex (or mock) returns a Gemini generateContent response.
#   4. GeminiResponseDecoder converts the Gemini response back to an
#      OpenAI chat.completion JSON (candidates → choices, function calls
#      → tool_calls, usageMetadata → usage, finishReason mapped per
#      OPENAI_VERTEX_SPEC.md §4.3).
#   5. Client receives an OpenAI-shaped chat.completion as if it had
#      called OpenAI directly — the Gemini schema is invisible to the SDK.
#
# Authorization is passed through unchanged; bring your own OAuth bearer.
#
# Test against the mock upstream (the mock returns a Gemini-shaped reply
# whenever the inbound path contains "publishers/google/models", which the
# filter's path rewrite guarantees):
#
#   python3 examples/mock_upstream.py     # in another terminal, port 18080
#   envoy -c vertex.yaml --log-level info
#   curl -sS http://127.0.0.1:10000/v1/chat/completions \
#     -H 'content-type: application/json' \
#     -H 'authorization: Bearer fake-oauth-token' \
#     -d '{"model":"gemini-2.5-flash","temperature":0.2,
#          "messages":[{"role":"system","content":"be concise"},
#                      {"role":"user","content":"summarize Envoy"}]}'
#
# What the mock sees: POST /v1/projects/my-project/locations/us-central1
# /publishers/google/models/gemini-2.5-flash:generateContent with a
# Gemini body (contents[], systemInstruction, generationConfig).
#
# What the client sees: a normal OpenAI chat.completion JSON with
# {id, object: "chat.completion", choices[0].message.content, usage}.
#
# Streaming (Gemini streamGenerateContent SSE → OpenAI chat.completion.chunk
# SSE) is a follow-up phase; this config sets timeout 60s for the
# non-streaming path.
#
# To point at real Vertex, change the cluster to a STRICT_DNS endpoint at
# {region}-aiplatform.googleapis.com:443 with a TLS transport_socket and
# keep a real OAuth2 bearer in the request.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: ingress
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          # ai_protocol_manager is non-terminal; router handles anything
          # the filter does not take ownership of. See passthrough.yaml
          # for the full rationale.
          route_config:
            name: demo_route
            virtual_hosts:
            - name: demo
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                direct_response: { status: 404, body: { inline_string: "no route" } }
          http_filters:
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              classifier:
                inference_path_prefixes:
                - /v1/chat/completions
                - /v1/completions
                - /v1/embeddings
              codec:
                max_inline_bytes: 65536
              inference_chain:
                filters: []
                dispatch:
                  target_schema: GEMINI_VERTEX
                  upstream_cluster: vertex_backend
                  gcp_project: my-project
                  gcp_location: us-central1
                  # When set, every request goes to this model regardless of
                  # what the client put in `model`. Uncomment to lock model:
                  # model_name_override: gemini-2.5-flash
                  timeout: 60s
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: vertex_backend
    type: STATIC
    connect_timeout: 5s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: vertex_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 18080 }
