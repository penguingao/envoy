# ai_protocol_manager — OpenAI pass-through demo
#
# Listens on :10000. Classifies POST /v1/chat/completions as Inference,
# parses the OpenAI body into AiRequest, runs the (empty) sub-chain, then
# re-encodes via OpenAiEncoder and forwards to the `openai_backend` cluster.
# Target schema is OPENAI_PASSTHROUGH so the body is round-tripped via
# residual_params (no field synthesis).
#
# Run a mock upstream first (see examples/mock_upstream.py), then:
#   envoy -c passthrough.yaml --log-level info
#   curl -sS http://127.0.0.1:10000/v1/chat/completions \
#     -H 'content-type: application/json' \
#     -H 'authorization: Bearer test-key' \
#     -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"hi"}]}'
#
# Expected: mock upstream receives the same JSON body, echoes a synthetic
# completion, client receives that completion verbatim.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: ingress
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          # ai_protocol_manager is non-terminal: it takes ownership of
          # classified Inference requests with a dispatch target, and
          # passes everything else (Unknown paths, agent traffic until the
          # agent mapper lands, or Inference without a dispatch configured)
          # to the router. Non-AI routes on the same listener work as any
          # normal HTTP proxy route.
          route_config:
            name: demo_route
            virtual_hosts:
            - name: demo
              domains: ["*"]
              routes:
              # AI routes reach this route only if the filter passed them
              # through (e.g. misconfiguration). Under normal operation the
              # filter sends them upstream via AsyncClient and injects the
              # response via encodeHeaders / encodeData — this route is
              # never consulted.
              - match: { prefix: "/v1/" }
                route: { cluster: openai_backend }
              # Non-AI fallback: anything else on this listener goes to the
              # same backend. Replace with your real routes.
              - match: { prefix: "/" }
                direct_response: { status: 404, body: { inline_string: "no route" } }
          http_filters:
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              classifier:
                inference_path_prefixes:
                - /v1/chat/completions
                - /v1/completions
                - /v1/embeddings
                - /v1/responses
              codec:
                max_inline_bytes: 65536
              inference_chain:
                filters: []
                dispatch:
                  target_schema: OPENAI_PASSTHROUGH
                  upstream_cluster: openai_backend
                  timeout: 30s
          # Terminal filter — handles everything ai_protocol_manager did not
          # StopIteration on. Required for any non-trivial HCM config.
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: openai_backend
    type: STATIC
    connect_timeout: 5s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: openai_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 18080 }
